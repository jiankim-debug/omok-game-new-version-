<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="오목 웹 게임 - 반응형 브라우저 게임"
    />
    <title>오목 게임</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">온라인 오목</p>
          <h1>오목 게임</h1>
        </div>

        <div class="header-actions">
          <button id="undo-btn" class="btn secondary" type="button">
            마지막 수 취소
          </button>
          <button id="new-game-btn" class="btn primary" type="button">
            새 게임
          </button>
        </div>
      </header>

      <section class="panel">
        <div class="info-row">
          <div class="info-box turn-box">
            <span class="label">현재 차례</span>
            <span id="turn-indicator" class="turn-indicator black">검은돌</span>
          </div>

          <div class="info-box status-box">
            <span class="label">상태</span>
            <span id="status-text">게임 시작</span>
          </div>

          <div class="info-box moves-box">
            <span class="label">수</span>
            <span id="move-count">0</span>
          </div>
        </div>

        <div class="board-wrapper">
          <div id="board" class="board" aria-label="오목판"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
