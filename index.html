<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="오목 웹 게임 - 1:1 대전 및 AI 대전"
    />
    <title>오목 게임</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c5d4e'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23f5f0e7'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23000000'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="app">
      <section id="mode-selection" class="panel mode-panel">
        <p class="eyebrow">게임 선택</p>
        <h2>어떤 대전 방식을 선택할까요?</h2>

        <div class="mode-options">
          <button class="mode-btn" type="button" data-mode="friend">
            <span class="mode-icon">👥</span>
            <span>
              <strong>친구와 1:1 하기</strong>
              <small>같은 컴퓨터에서 친구와 대결</small>
            </span>
          </button>

          <button class="mode-btn" type="button" data-mode="ai">
            <span class="mode-icon">🤖</span>
            <span>
              <strong>인공지능과 플레이하기</strong>
              <small>AI 상대와 실전처럼 겨뤄보세요</small>
            </span>
          </button>
        </div>

        <div class="difficulty-panel">
          <p class="eyebrow">난이도 선택</p>
          <div class="difficulty-options">
            <button class="difficulty-btn active" data-difficulty="easy" type="button">
              쉬움
            </button>
            <button class="difficulty-btn" data-difficulty="normal" type="button">
              보통
            </button>
            <button class="difficulty-btn" data-difficulty="hard" type="button">
              어려움
            </button>
          </div>
        </div>
      </section>

      <section id="game-shell" class="game-shell hidden">
        <header class="topbar">
          <div class="brand-block">
            <p class="eyebrow">온라인 오목</p>
            <h1 id="game-title">오목 게임</h1>
          </div>

          <div class="header-actions">
            <button id="mode-select-btn" class="btn secondary" type="button">
              모드 선택
            </button>
            <button id="undo-btn" class="btn secondary" type="button">
              마지막 수 취소
            </button>
            <button id="new-game-btn" class="btn primary" type="button">
              새 게임
            </button>
          </div>
        </header>

        <section class="panel">
          <div class="info-row">
            <div class="info-box turn-box">
              <span class="label">현재 차례</span>
              <span id="turn-indicator" class="turn-indicator black">검은돌</span>
            </div>

            <div class="info-box status-box">
              <span class="label">상태</span>
              <span id="status-text">게임 시작</span>
            </div>

            <div class="info-box moves-box">
              <span class="label">수</span>
              <span id="move-count">0</span>
            </div>
          </div>

          <div class="score-row">
            <div class="score-box">
              <span class="label">검은돌</span>
              <span id="black-score">0</span>
            </div>
            <div class="score-box">
              <span class="label">흰돌</span>
              <span id="white-score">0</span>
            </div>
            <div class="score-box">
              <span class="label">무승부</span>
              <span id="draw-score">0</span>
            </div>
          </div>

          <div class="board-wrapper">
            <div id="board" class="board" aria-label="오목판"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
